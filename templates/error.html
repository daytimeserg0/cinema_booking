{% extends "base.html" %}
{% block title %}{{ status }} — {{ title }}{% endblock %}
{% block content %}
  <div class="container error-page">
    <span class="error-number" aria-hidden="true">{{ status }}</span>
    <span class="eyebrow">Небольшой антракт</span>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="button button-primary" href="{{ url_for('home') }}">Вернуться к афише <span aria-hidden="true">↗</span>
    </a>
  </div>
{% endblock %}
