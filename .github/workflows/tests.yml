name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: cinema_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinema -d cinema_booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: cinema_booking_test
      DB_USER: cinema
      DB_PASSWORD: test-password
      TEST_DB_NAME: cinema_booking_test
      FLASK_SECRET_KEY: ci-only-not-for-deployment
      CINEMA_TIMEZONE: Europe/Moscow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest
